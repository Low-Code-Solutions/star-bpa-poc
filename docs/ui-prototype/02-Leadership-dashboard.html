dden=\"true\"><path d=\"M3 7h7l2 2h9v11H3zM9 14h6\"/><\/svg>\n          <strong style=\"font-size: 16px; color: #101828\">{{emptyTitle}}<\/strong>\n          <span style=\"font-size: 14px; color: #475467; max-width: 440px\">{{emptyText}}<\/span>\n          <button type=\"button\" onClick=\"{{retry}}\" style=\"height: 40px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 8px; background: #FFFFFF; color: #1D2939; font: inherit; font-weight: 600; cursor: pointer\">{{emptyBtn}}<\/button>\n        <\/div>\n      <\/sc-if>\n\n      <!-- ===================== DASHBOARD ===================== -->\n      <sc-if value=\"{{isDash}}\" hint-placeholder-val=\"{{true}}\">\n\n        <!-- Summary (rule-based narrative) -->\n        <section aria-label=\"Summary\" style=\"display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1px solid #E4E7EC; border-left: 4px solid #1B7A99; border-radius: 12px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(31,42,48,.06)\">\n          <span aria-hidden=\"true\" style=\"width: 36px; height: 36px; flex: none; border-radius: 10px; background: #E6F4F9; color: #1B7A99; display: inline-flex; align-items: center; justify-content: center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M4 6h16M4 12h10M4 18h13\"/><\/svg><\/span>\n          <div style=\"flex: 1; min-width: 0\"><div class=\"hfont\" style=\"font-size: 18px; font-weight: 600; color: #101828\">Summary<\/div><p style=\"margin: 4px 0 0; font-size: 15px; line-height: 1.55; color: #101828\">{{summary}}<\/p><\/div>\n        <\/section>\n\n        <!-- Needs attention (AttentionItem component) -->\n        <section id=\"sec-attn\" aria-labelledby=\"h-attn\" style=\"background: #F9FAFB; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center\">\n            <div><h2 id=\"h-attn\" style=\"{{labelS}}\"><span aria-hidden=\"true\" style=\"width: 36px; height: 36px; flex: none; border-radius: 10px; background: #E6F4F9; color: #1B7A99; display: inline-flex; align-items: center; justify-content: center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l10 18H2zM12 10v5M12 18h.01\"/><\/svg><\/span>Needs attention <span style=\"{{countS}}\">{{attnShownN}}<\/span><\/h2><p style=\"margin: 4px 0 0; font-size: 12px; color: #1F6B42\"><strong>Business value:<\/strong> Problems surface every week from approved data, not at month-end.<\/p><\/div>\n            <span style=\"display: flex; gap: 10px; align-items: center\"><\/span>\n          <\/div>\n          <div class=\"g2c\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\">\n          <sc-for list=\"{{attnGroups}}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; box-shadow: 0 2px 8px rgba(31,42,48,.07); padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n              <div style=\"display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid #E4E7EC; margin-bottom: 4px\">\n                <span aria-hidden=\"true\" style=\"{{g.tileS}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"{{g.icon}}\"/><\/svg><\/span>\n                <span style=\"flex: 1; min-width: 0\"><strong class=\"hfont\" style=\"display: block; font-size: 15px; font-weight: 600; color: #101828\">{{g.label}}<\/strong><span style=\"font-size: 12px; color: #475467\">{{g.sub}}<\/span><\/span>\n              <\/div>\n              <sc-for list=\"{{g.items}}\" as=\"a\" hint-placeholder-count=\"3\">\n                <div onClick=\"{{a.open}}\" role=\"button\" tabindex=\"0\" style=\"cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F2F4F7\">\n                  <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1D2939\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"{{a.icon}}\"/><\/svg>\n                  <span style=\"display: block; flex: 1; min-width: 0; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer\">\n                    <span style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\"><span style=\"font-size: 14px; font-weight: 600; color: #101828\">{{a.name}}<\/span><span style=\"{{a.sevS}}\">{{a.sev}}<\/span><\/span>\n                    <span style=\"display: block; font-size: 12px; color: #475467; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{a.dept}} \u00b7 {{a.line}}<\/span>\n                  <\/span>\n                  <strong class=\"num\" style=\"font-size: 16px; color: #101828\">{{a.n}}<\/strong>\n                  \n                <\/div>\n              <\/sc-for>\n              <sc-if value=\"{{g.empty}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size: 13px; color: #1F6B42; padding: 10px 0\">Nothing needs attention<\/span><\/sc-if>\n            <\/div>\n          <\/sc-for>\n          <\/div>\n          \n        <\/section>\n\n      <\/sc-if>\n      <sc-if value=\"{{showFlow}}\" hint-placeholder-val=\"{{false}}\">\n        <!-- Where is work waiting -->\n        <section id=\"sec-flow\" aria-labelledby=\"h-flow\" style=\"background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 12px; box-shadow: 0 1px 3px rgba(31,42,48,.06); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items:
