# Builds and tests the backend and the React portal, and lints the API contract, on every pull request and on pushes to
# main (BPA-43, P4, S21). Camunda Process Test and Testcontainers (PostgreSQL, the integration Camunda) need Docker, which
# ubuntu-latest provides. Same commands as a local run: ./mvnw -B verify (backend/), npm run lint, npm run format:check, npm test and
# npm run build (frontend/).
name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint) and format check (Prettier), ADR 0017
        run: npm run lint && npm run format:check
      - run: npm test
      - run: npm run build

  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint api/openapi.yaml (Redocly, S21)
        run: npx --yes @redocly/cli@2.62.1 lint api/openapi.yaml
