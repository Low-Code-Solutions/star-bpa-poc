# Builds the Spring Boot backend and runs all its tests on every pull request and on pushes to main (BPA-43, P4).
# Camunda Process Test and Testcontainers PostgreSQL need Docker, which ubuntu-latest provides.
# Same command as a local run from backend/: ./mvnw -B verify
name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
