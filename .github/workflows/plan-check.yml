# Plan check and harness tests on every pull request (ADR 0015, 09 L13, BPA-38).
# plan-check fails a BPA-<n>-... branch with no plan, and warns while the plan is not Closed.
name: Plan check

on:
  pull_request:

permissions:
  contents: read

jobs:
  plan-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the item's plan
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: sh .github/scripts/plan-check.sh "$HEAD_REF" .

  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan-check tests
        run: sh .github/scripts/test-plan-check.sh
      - name: Claude Code hook tests
        run: sh .claude/hooks/test-hooks.sh
