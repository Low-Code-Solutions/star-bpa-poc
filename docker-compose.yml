# STAR BPA POC runtime: Camunda 8 (Orchestration Cluster + Connectors) on PostgreSQL, plus WireMock.
# Same file on laptops and the showcase VM. Copy .env.example to .env first.

name: star-bpa-poc

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [star]
    restart: unless-stopped

  camunda:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.1}
    ports:
      - "8080:8080"   # Operate, Tasklist, Admin, REST API
      - "26500:26500" # gRPC
      - "9600:9600"   # management / health
    environment:
      # PostgreSQL replaces Elasticsearch/H2 as secondary storage
      CAMUNDA_DATA_SECONDARY_STORAGE_TYPE: rdbms
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_URL: jdbc:postgresql://postgres:5432/${CAMUNDA_DB_NAME:-camunda}
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_USERNAME: ${CAMUNDA_DB_USER:-camunda}
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_PASSWORD: ${CAMUNDA_DB_PASSWORD:-camunda}
      # Built-in basic authentication; creates the demo/demo admin (ADR 0005, S29)
      CAMUNDA_SECURITY_AUTHENTICATION_METHOD: basic
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME: Demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL: demo@example.com
      CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0: demo
    volumes:
      - camunda-data:/usr/local/camunda/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9600/actuator/health/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [star]
    restart: unless-stopped

  connectors:
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION:-8.10.1}
    ports:
      - "8086:8080"
    environment:
      CAMUNDA_CLIENT_MODE: self-managed
      CAMUNDA_CLIENT_GRPC_ADDRESS: http://camunda:26500
      CAMUNDA_CLIENT_REST_ADDRESS: http://camunda:8080
      CAMUNDA_CLIENT_AUTH_METHOD: basic
      CAMUNDA_CLIENT_AUTH_USERNAME: demo
      CAMUNDA_CLIENT_AUTH_PASSWORD: demo
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    depends_on:
      camunda:
        condition: service_healthy
    networks: [star]
    restart: unless-stopped

  wiremock:
    image: wiremock/wiremock:${WIREMOCK_VERSION:-3.9.1}
    command: ["--verbose"]
    ports:
      - "8089:8080"
    volumes:
      - ./backend/mocks/mappings:/home/wiremock/mappings
      - ./backend/mocks/__files:/home/wiremock/__files
    networks: [star]
    restart: unless-stopped

  # Mock SMTP server (09 S8; BPA-16): catch-only, the backend sends to mailpit:1025 and the inbox is at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.32.0}
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [star]
    restart: unless-stopped

  # pgAdmin to browse the POC database (local tool, not part of the product; profile "tools", so a plain `docker compose up -d` does not
  # pull it): `docker compose --profile tools up -d pgadmin`, then http://localhost:5050 (no login: single-user mode, bound to this machine only).
  # The server "STAR POC PostgreSQL" is pre-registered from backend/postgres/pgadmin/servers.json; pgAdmin asks for the password once
  # (POSTGRES_PASSWORD in .env; default postgres). Settings are not kept across `down`, nothing here is data.
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-9.10}
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./backend/postgres/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [star]
    restart: unless-stopped

  # Spring Boot backend and job workers (ADR 0002). Build context is the repo root so models/ and templates/ are visible (BPA-43).
  # Profile local runs the S22 persona sync at start-up: as the Camunda admin (CAMUNDA_ADMIN_*) it creates the personas and
  # `bpa-service` (S25), then the app deploys the models and runs its workers as `bpa-service` (ADR 0005).
  bpa-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # local is the default. For QA (BPA-81) set BPA_PROFILES=local,qa in .env; qa alone would lose the persona sync, which needs local.
      SPRING_PROFILES_ACTIVE: ${BPA_PROFILES:-local}
      # QA only (BPA-81): the business date, yyyy-MM-dd. Empty or absent means the system clock. Ignored (with a WARN) unless profile qa is active.
      BPA_CLOCK_TODAY: ${BPA_CLOCK_TODAY:-}
      BPA_PROGRESS_ALLOW_REOPEN: ${BPA_PROGRESS_ALLOW_REOPEN:-false} # BPA-83: true lets the Project Manager reopen a Locked week (demo only)
      CAMUNDA_GRPC_ADDRESS: http://camunda:26500
      CAMUNDA_REST_ADDRESS: http://camunda:8080
      CAMUNDA_ADMIN_USER: ${CAMUNDA_ADMIN_USER:-demo}
      CAMUNDA_ADMIN_PASSWORD: ${CAMUNDA_ADMIN_PASSWORD:-demo}
      BPA_DB_URL: jdbc:postgresql://postgres:5432/${BPA_DB_NAME:-bpa}
      BPA_DB_USER: ${BPA_DB_USER:-bpa}
      BPA_DB_PASSWORD: ${BPA_DB_PASSWORD:-bpa}
      BPA_SERVICE_PASSWORD: ${BPA_SERVICE_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      WIREMOCK_BASE_URL: http://wiremock:8080
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      camunda:
        condition: service_healthy
      wiremock:
        condition: service_started
      mailpit:
        condition: service_started
    networks: [star]
    restart: unless-stopped

  # The React portal (BPA-80; ADR 0004, ADR 0005 S26): built in the image, served by nginx at http://localhost:3000, which also proxies
  # /api to bpa-app:8080, so the portal and the API are one origin and the session and XSRF-TOKEN cookies work as under `npm run dev`
  # (Vite on :5173, unchanged). Build context is the repo root, like bpa-app: the build reads api/openapi.yaml.
  # bpa-app has no healthcheck, so for a few seconds after a cold start the portal's /api calls answer 502 until the app is up.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - bpa-app
    networks: [star]
    restart: unless-stopped

volumes:
  pgdata:
  camunda-data:

networks:
  star:
