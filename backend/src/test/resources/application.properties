# Test-only settings (not read in production). They merge with src/main/resources/application.yml.
#
# BPA-9 (Ahsan, 5 Nov 2026): a job lock that expires in 10 s, not the client default of 5 minutes (PT5M).
# The integration test classes share one Camunda and each starts its own application context and job workers. When a class ends, its
# Camunda client closes, but an activate-jobs request it still has pending at the gateway can be handed the first job the next class
# creates; that job then stays locked to the closed client until the lock expires, and the new class's worker never sees it. The first
# test of SignOffApiTest failed this way in every full verify run (local and CI), while the class passes alone. With a short lock the
# job comes back within the tests' 60 s wait. Nothing in the tests depends on a job staying locked longer than a few seconds.
camunda.client.worker.defaults.timeout=PT10S
