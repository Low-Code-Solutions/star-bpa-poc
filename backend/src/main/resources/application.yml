spring:
  application:
    name: bpa
  servlet:
    multipart:
      # BPA-12 (ASSUMPTION): an assignment file is small, so a larger upload is refused before it is read.
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${BPA_DB_URL:jdbc:postgresql://localhost:5432/bpa}
    username: ${BPA_DB_USER:bpa}
    password: ${BPA_DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true # RFC 9457 errors (S20)
  jackson:
    # The contract leaves optional fields out rather than sending null (e.g. Task.confirmMessage, TaskSummary.workpackNumber:
    # "absent"), and the generated models carry no @JsonInclude (BPA-26 review). Values inside free-form maps are kept.
    default-property-inclusion: non_null
  mail:
    # Mock SMTP server Mailpit (09 S8; BPA-16). In Docker Compose the backend sets SPRING_MAIL_HOST=mailpit; outside it, the compose port 1025 on localhost.
    host: localhost
    port: 1025
  flyway:
    # V1 and the repeatable seed use schema-qualified names; the history table lives in bpa too (BPA-43 plan, Q1 of BPA-42).
    schemas: bpa

server:
  servlet:
    session:
      timeout: 30m # S27 (ASSUMPTION), configurable
      cookie: # S26: HttpOnly, SameSite=Lax, Secure outside localhost
        http-only: true
        same-site: lax
        secure: ${BPA_SESSION_COOKIE_SECURE:false}
  tomcat:
    # BPA-52: a refused upload (above 5 MB) is answered 413 only if the client can still read the answer. By default Tomcat stops swallowing a rejected
    # body after 2 MB and drops the connection, so the client sees a reset instead of the 413; the limit is raised above the largest body worth refusing.
    max-swallow-size: 20MB

management:
  health:
    mail:
      # BPA-16: a mail server that is down must not take /actuator/health down (the app still serves; only the notice jobs get incidents, 09 S7).
      enabled: false

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}
    auth:
      method: basic
      username: bpa-service # S25: the one technical user, created by the S22 job
      password: ${BPA_SERVICE_PASSWORD:}

bpa:
  mail:
    # ASSUMPTION (BPA-16): the sender of the drawing-revision email; no source names one.
    from: star-bpa@example.com
  camunda:
    # Camunda REST API for the login check and, with profile local or showcase, the S22 persona sync.
    rest-url: ${camunda.client.rest-address}
    admin: # Used only by the S22 persona sync (ADR 0005, BPA-43 Q4); S29 keeps demo/demo.
      username: ${CAMUNDA_ADMIN_USER:demo}
      password: ${CAMUNDA_ADMIN_PASSWORD:demo}
  personas:
    file: classpath:personas.yaml
    demo-password: ${DEMO_PASSWORD:}
    service-password: ${BPA_SERVICE_PASSWORD:}
  # BPA-48 (Epic 2 settings; Jira description item 6, comment 10498; the keys under bpa: are an ASSUMPTION, plan Q9). Nothing reads them yet:
  # the stories that do are BPA-58 (month lock), BPA-59 and BPA-62 (progress source), BPA-60 (progress basis), BPA-64 and BPA-65 (alerts).
  # hours.approvalRoute is not here: the HR route is parked with BPA-71 (D2).
  progress:
    basis: Physical # Physical | Hours (C-E2-2); the default follows FRD-21
    source: FMS # FMS | PMS (C-E2-3); the default follows FRD-21
  hours:
    month-lock-day: 1 # 1 (FRD-5-3 5.3.3.3) or 16 (FRD-5-3 5.3.8.1), S5
  alerts:
    # D3: the PCON Manager has no login; both variance alerts go to this address as email (FRD-22 22.10). The address is an ASSUMPTION (synthetic).
    pcon-manager-email: pcon-manager@example.com
  # Backend task API (09 S14, ADR 0004; BPA-26): the per-task variable allow-lists, keyed by BPMN element ID (brackets keep
  # the key as written). write: the only names a completion may carry (400 otherwise); names from the CompleteTaskRequest
  # description in api/openapi.yaml. read: what GET /api/v1/tasks/{key} returns in `variables`; equal to write for prefill
  # (ASSUMPTION, no source names the read list). workpackNumber, validationMessages and confirmMessage have their own fields.
  tasks:
    # BPA-50: the Epic 2 process joins, for UserTask_BookHours (its other user tasks have no allow-list entry yet, so they are not served)
    process-ids: [Process_PPC_WorkPackAssignment, Process_PPC_TimesheetToProgress, Process_PPC_WeeklyProgressPeriod]
    allow-lists:
      "[UserTask_BookHours]": # supervisor (and production-team, C-E2-5), BPA-50: hours are saved line by line through the lines API, not as
        # variables of the completion, so both lists are empty; completing the task is "Send to Timekeeper" (BPA-53)
        write: []
        read: [hoursDecision, hoursReason] # BPA-53: why the Timekeeper returned the hours
      "[UserTask_ValidateHours]": # timekeeper, BPA-53: the decision (Validated or Returned) and, for a return, the reason; the lines are read through
        # GET /api/v1/hours-submissions/{id} (hoursSubmissionId says which)
        write: [hoursDecision, hoursReason]
        read: [hoursSubmissionId, hoursDecision, hoursReason]
      "[UserTask_ApproveHoursProduction]": # production-supervisor, BPA-56: Approved, Returned or Rejected and, for the last two, the reason. read leaves
        # hoursDecision out so the Timekeeper's "Validated" is never offered back; the lines come from GET /api/v1/hours-submissions/{id}
        write: [hoursDecision, hoursReason]
        read: [hoursSubmissionId]
      "[UserTask_ApproveHoursPpc]": # ppc-team, BPA-57: as the Production approval (BPA-56): the decision and, for Returned or Rejected, the reason; read leaves
        # hoursDecision out so an earlier decision is never offered back
        write: [hoursDecision, hoursReason]
        read: [hoursSubmissionId]
      "[UserTask_SendHoursToFms]": # ppc-team, BPA-58: fmsHandOffs, one entry per file ({fmsHoursExportId, outcome, reason}); read gives the week and the files to list
        write: [fmsHandOffs]
        read: [weekEnding, fmsHoursExports]
      "[UserTask_UploadCompletionReport]": # ppc-team, BPA-59: the id of the upload that counts (Q-DM20); read gives the week; validationMessages has its own field
        write: [completionReportId]
        read: [weekEnding]
      "[UserTask_CreateWorkPack]": # time-method-analyst (G9), BPA-6
        write: [activityRef, drawingRef, departmentRef, completionDate, phases, materials]
        read: [activityRef, drawingRef, departmentRef, completionDate, phases, materials]
      "[UserTask_ConfirmWorkPack]": # time-method-analyst (G9), BPA-8, BPA-23; a material line's id sits inside materials
        write: [activityRef, drawingRef, departmentRef, completionDate, phases, materials]
        read: [activityRef, drawingRef, departmentRef, completionDate, phases, materials]
      "[UserTask_SignOffRelease]": # project-engineer (G9), BPA-9
        write: [signOffDecision, declineReason]
        # BPA-9 (Ahsan, 5 Nov): read also carries what the Project Engineer signs, shown read-only (Form_SignOffRelease); write stays as it is
        read: [activityRef, drawingRef, departmentRef, completionDate, phases, materials, signOffDecision, declineReason]
      "[UserTask_ScheduleWorkPack]": # production-planner (G9), BPA-11
        write: [plannedStartDate, plannedEndDate]
        # BPA-11: read also carries what the screen shows read-only (the Work Pack and its date to complete), as for the sign-off (BPA-9);
        # the dates entered come back on a returned task. Write is unchanged: the data-model names, not the form spec names (BPA-46 Q2).
        read: [activityRef, drawingRef, departmentRef, completionDate, plannedStartDate, plannedEndDate]

# S9, ADR 0013: business dates (D20 "no past date", ...) are read in this zone; instants stay UTC.
app:
  business-zone: Asia/Riyadh
  # D9 (PO), data model §6.2: the lead time for planned dates, in days; configuration, not data, so a test can override it.
  lead-time-days: 7
  # BPA-51 decision (a), data model §6.2 pattern: the most hours one Worker can have on one date over all Work Packs, in hours; configuration, not data,
  # so STAR can change it without a code change. Passed to Decision_HoursWithinBudget as dailyHoursLimit at save and at send. 16 is an ASSUMPTION
  # (FRD-5-12 §5.12.5.2 #7 says "e.g., 16h", E2-D6).
  daily-hours-limit: 16
