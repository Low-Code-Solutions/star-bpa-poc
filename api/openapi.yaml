        receivedAt:
          type: string
          format: date-time
        outcome:
          type: string
          description: |
            File-level line; absent when the rows carry the outcomes. "File has no rows", "File cannot be read", "File layout not
            recognised" (data model §13.2.3), "File has too many rows" (more than 5000 rows; ASSUMPTION, as BPA-12).
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetFileRow'
    TimesheetFileRow:
      type: object
      description: One timesheet_file_row, the values as uploaded (raw text) and the outcome
      required: [rowNumber, outcome]
      properties:
        rowNumber:
          type: integer
          description: Spreadsheet row, 1-based (row 1 is the header)
        workpackNumber:
          type: string
        badgeNo:
          type: string
        workDate:
          type: string
          description: As written in the file, for example 16/11/2026
        phase:
          type: string
        hours:
          type: string
          description: As written in the file
        remarks:
          type: string
        outcome:
          type: string
          description: |
            Row outcome. "Saved", or the reason (data model §13.2.3 and the BPA-50 and BPA-51 line rules, texts with values, so not
            an enum): "Workpack number is required", "Badge No is required", "Work date is required", "Phase is required",
            "Hours is required", "Work Pack not found", "Worker not assigned to this Work Pack", "Time sheet is Cancelled",
            "Hours for <WP> are in approval; book them after the decision" (ASSUMPTION: detection), "Work date is not a valid date",
            "Hours must be a number", "Hours must be greater than 0", "Hours can have at most 2 decimal places", "Work date cannot be
            in the future", "Hours for <Month YYYY> are locked" (BPA-67), "Work Pack <WP> is Completed" (BPA-67), "Week ending <date> is closed", "Phase <phase> is not on this Work Pack", "Hours already booked for
            <badge> on <date> for phase <phase>", "Worker <badge> would exceed <limit> hours on <date>", "Phase <phase> budget of
            <budget> h would be exceeded", "Remarks can be at most 250 characters".
