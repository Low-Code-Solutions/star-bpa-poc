      tags: [progress-periods]
      operationId: getProgressWeekWorkpacks
      summary: One row per Work Pack of the week, for the completion % approval
      description: |
        BPA-60 (E2-10). The rows the Approve completion % screen shows for the week ending {weekEnding}: every In Progress Work Pack and any Work Pack
        that already has a progress row for the week (plan Q4). Per row: the reported % (FMS or PMS; a Work Pack with no report row is marked
        `noReportRow` and carries the last locked %, D6), the last locked % (0 when never locked), the hours-based % (Approved hours up to the week
        ending divided by the Work Pack's budget, derived and never stored, FRD-7 §7.7.1), the latest % reported by production (information only,
