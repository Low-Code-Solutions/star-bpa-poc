        pre-fill: by `progress.basis`, Physical = the reported %, Hours = the hours-based %; a stored approval, when the task came back, wins (plan Q9).
        Groups ppc-team and project-manager (delta §7). 404 when the week has no progress period.
      x-assumption: true
      x-assumption-note: the shape, the Work Pack selection, the hours counted and the 404 text are ASSUMPTIONs of the plan
      responses:
        '200':
          description: The week's rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressWeek'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No progress period for this week ending
          x-assumption: true
          x-assumption-note: text not stated by any story
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { status: 404, title: Not Found, detail: Week not found }
  /api/v1/progress-periods/{weekEnding}/earned-manhours:
    parameters:
      - name: weekEnding
        in: path
        required: true
        description: The week's Thursday, as progress_period.week_ending (YYYY-MM-DD)
        schema:
          type: string
          format: date
    get:
      tags: [progress-periods]
      operationId: getProgressWeekEarnedManhours
      summary: Each activity's progress % and Earned man-hours for the week
      description: |
        BPA-62 (E2-13). One row per activity that has a Released, In Progress or Completed Work Pack, as `calculate-earned-manhours` stored it in
        `activity_progress` for the week ending {weekEnding}: the activity % (hours-weighted roll-up of its Work Packs' latest approved %, 2 decimals),
        the budgeted units snapshotted on the row, the cumulative Earned man-hours (activity % / 100 x budgeted units, rounded half-up to 2 decimals;
        absent when the activity has no budgeted units), the Earned man-hours of the latest Locked week before this one, and the week's increase
        (this week's Earned MH minus that one, 0 when there is none; derived, never stored). A week not calculated yet gives an empty list.
        Groups ppc-team, cost-controller and (BPA-66, for the Approve weekly progress screen) project-manager (delta §7). 404 when the week has no progress period.
      x-assumption: true
      x-assumption-note: the shape, the week's increase base (0 when no Locked week) and the 404 text are ASSUMPTIONs of the plan
      responses:
        '200':
          description: The week's activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarnedManhoursWeek'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No progress period for this week ending
          x-assumption: true
          x-assumption-note: text not stated by any story
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { status: 404, title: Not Found, detail: Week not found }
  /api/v1/progress-periods/{weekEnding}/cbs-actuals:
    parameters:
      - name: weekEnding
        in: path
        required: true
        description: The week's Thursday, as progress_period.week_ending (YYYY-MM-DD)
        schema:
          type: string
          format: date
    get:
      tags: [progress-periods]
      operationId: getProgressWeekCbsActuals
      summary: Actual man-hours by CBS against the Current Forecast for the week
      description: |
        BPA-64 (E2-14). One row per CBS that has approved man-hours up to the week ending {weekEnding} or a Current Forecast: the actual man-hours (cumulative
        Approved line hours dated on or before the week ending whose time sheet carries the CBS), the Current Forecast (absent when there is none), the ETC
        (forecast minus actual; negative when over, never an extra alert), the variance % ((actual - forecast) / forecast x 100, 2 decimals half-up, absent
        without a forecast), the result of Decision_ManhourVariance (NO_FORECAST, OVER_15_PCT, WITHIN; worked out with the decision's rules), whether a man-hour
        alert was raised for the CBS in this period, and the Cost Controller's remark. Lines whose time sheet has no CBS (D40) are the single total
        `noCbsManhours`; they never alert. Groups cost-controller and project-manager (delta §7). 404 when the week has no progress period.
      x-assumption: true
      x-assumption-note: the shape, the live calculation of the actuals and the 404 text are ASSUMPTIONs of the plan
      responses:
        '200':
          description: The week's CBS rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CbsActualsWeek'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No progress period for this week ending
          x-assumption: true
          x-assumption-note: text not stated by any story
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { status: 404, title: Not Found, detail: Week not found }
  /api/v1/fms-hours-exports/{fmsHoursExportId}/file:
    parameters:
      - name: fmsHoursExportId
        in: path
        required: true
        description: fms_hours_export.id
        schema:
          type: string
          format: uuid
    get:
      tags: [fms-hours-exports]
      operationId: downloadFmsHoursExport
      summary: Download a weekly FMS hours file
      description: |
        BPA-58 (E2-08). The .xlsx the weekly cut-off generated, in the FMS layout of templates/fms-hours-export-template.xlsx.
        The stored bytes are returned every time; the file is never rebuilt. Group ppc-team only (agreed 10 Nov 2026 (a)).
      x-assumption: true
      x-assumption-note: the file name fms-hours-<weekEnding>-<yyyy-MM>.xlsx; the layout is the Epic 2 working assumption until STAR sends its FMS template
      responses:
        '200':
          description: The file (.xlsx)
          headers:
            Content-Disposition:
              description: attachment; filename="fms-hours-<weekEnding>-<yyyy-MM>.xlsx"
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No file with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { status: 404, title: Not Found, detail: File not found }
  /api/v1/hours-submissions/{submissionId}:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [timesheet-lines]
      operationId: getHoursSubmission
      summary: Read a submission of hours with its lines (the Timekeeper's screen)
      description: BPA-53 (the shape is an ASSUMPTION). Groups timekeeper, production-supervisor (BPA-56) and ppc-team (BPA-57).
      x-assumption: true
      x-assumption-note: the endpoint and its shape are not stated by BPA-53
      responses:
        '200':
          description: The submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoursSubmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No submission with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example: { status: 404, title: Not Found, detail: Submission not found }
  /api/v1/timesheet-processes:
    post:
      tags: [timesheet-processes]
      operationId: startTimesheetProcess
      summary: Start the timesheet process of a Work Pack assigned before Epic 2 was deployed (one-off)
      description: |
        Publishes WorkPackAssigned for one Work Pack, which starts Process_PPC_TimesheetToProgress (BPA-49; E2-D18). Only for a Work Pack
        whose assignment_state is Assigned and that has no timesheet process yet; a Work Pack assigned after BPA-49 gets its process from
        the end of its Epic 1 instance, not from this call. Group ppc-team (ASSUMPTION in the story). "Already running" means
        WorkPackAssigned was published once for this Work Pack (the `published_message` record), not that an instance is still active:
        the publication call does not say whether a start event received it. Source: BPA-49.
      x-assumption: true
      x-assumption-note: group ppc-team (BPA-49 states it as an ASSUMPTION); the 201 body, the 400 and the 503 are not stated by the story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetProcessRequest'
      responses:
        '201':
          description: WorkPackAssigned published; the timesheet process starts (BPA-49)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetProcessRequest'
        '400':
          description: workpackNumber is missing or not WP- and six digits (x-assumption)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                status: 400
                title: Bad Request
                detail: workpackNumber is required, as WP- followed by 6 digits
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkPackNotFound'
        '409':
          description: The timesheet process is already running, or the Work Pack is not assigned yet (BPA-49)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyRunning:
                  value:
                    status: 409
                    title: Conflict
                    detail: Timesheet process already running for WP-000457
                notAssigned:
                  value:
                    status: 409
                    title: Conflict
                    detail: WP-000480 is not assigned yet
        '503':
          $ref: '#/components/responses/EngineUnavailable'
  /api/v1/me/notifications:
    get:
      tags: [notifications]
      operationId: listMyNotifications
      summary: The logged-in user's drawing-revision notices
      description: |
        In-system notices for the session user only; no parameter selects another user (BPA-16 "A user sees only their own
        notices"; D44). Source: BPA-16.
      responses:
        '200':
          description: The user's notices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/variance-alerts:
    get:
      tags: [variance-alerts]
      operationId: listMyVarianceAlerts
      summary: The logged-in user's in-system variance alerts
      description: |
        BPA-64 (E2-14), BPA-65 (E2-15). The in-system man-hour and cost alerts sent to the session user only, newest first; no parameter selects another user. The
        message is the alert text (D3). Any logged-in persona may call it and gets only its own alerts, so a persona with none gets an empty list (BPA-65).
      x-assumption: true
      x-assumption-note: the shape and the list order are ASSUMPTIONs of the plan
      responses:
        '200':
          description: The user's alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VarianceAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    TimesheetId:
      name: timesheetId
      in: path
      required: true
      description: digital_timesheet.id
      schema:
        type: string
        format: uuid
    LineId:
      name: lineId
      in: path
      required: true
      description: digital_timesheet_line.id
      schema:
        type: string
        format: uuid
    TaskKey:
      name: taskKey
      in: path
      required: true
      description: Camunda user task key
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
        example: '2251799813685612'
    WorkpackNumberPath:
      name: workpackNumber
      in: path
      required: true
      description: Workpack number, WP- followed by 6 digits (D15)
      schema:
        $ref: '#/components/schemas/WorkpackNumber'
    WorkpackNumberQuery:
      name: workpackNumber
      in: query
      required: true
      description: Workpack number, WP- followed by 6 digits (D15)
      schema:
        $ref: '#/components/schemas/WorkpackNumber'
  responses:
    TimesheetNotFound:
      description: No Digital Time sheet with this id (BPA-50)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { status: 404, title: Not Found, detail: Time sheet not found }
    LineNotFound:
      description: No hour line with this id (BPA-50)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example: { status: 404, title: Not Found, detail: Line not found }
    Unauthorized:
      description: Not logged in, or the session expired (S27)
      x-assumption: true
      x-assumption-note: no story states the text
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            status: 401
            title: Unauthorized
            detail: Not logged in, or the session has expired
    Forbidden:
      description: |
        The user's groups do not allow the call, or the CSRF token is missing. Stories give only the code (BPA-6, 7, 10,
        12, 14, 15); the text is x-assumption.
      x-assumption: true
      x-assumption-note: text not stated by any story
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            status: 403
            title: Forbidden
            detail: Your groups do not allow this call, or the CSRF token is missing
    TaskForbidden:
      description: |
        The task's candidate groups do not include any of the user's groups (BPA-26 "Wrong group is forbidden"; 09 S6).
        BPA-26 states the text for completing; using it for reading a task is x-assumption.
      x-assumption: true
      x-assumption-note: BPA-26 states this text for POST complete only; reused for GET /tasks/{taskKey}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            status: 403
            title: Forbidden
            detail: You are not allowed to work on this task
    TaskNotFound:
      description: No open or completed task with this key (BPA-26 "Unknown task")
      x-assumption: true
      x-assumption-note: BPA-26 states this text for GET /tasks/{taskKey} only; reused for POST complete
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            status: 404
            title: Not Found
            detail: Task not found
    WorkPackNotFound:
      description: No Work Pack with this number (BPA-7, BPA-11, BPA-14, BPA-15 "Unknown Work Pack")
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            status: 404
            title: Not Found
            detail: Work Pack not found
    InvalidWorkpackNumber:
      description: The workpackNumber is missing or does not match WP-###### (D15)
      x-assumption: true
      x-assumption-note: text not stated by any story
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            status: 400
            title: Bad Request
            detail: Workpack number must match WP-######
    EngineUnavailable:
      description: Camunda cannot be reached; nothing was changed
      x-assumption: true
      x-assumption-note: text not stated by any story
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            status: 503
            title: Service Unavailable
            detail: The process engine is not available right now; try again later
  schemas:
    WorkpackNumber:
      type: string
      pattern: '^WP-[0-9]{6}$'
      example: WP-000457
    CamundaKey:
      type: string
      pattern: '^[0-9]{1,19}$'
      description: A Camunda key as a string of digits
      example: '2251799813685501'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
    Me:
      type: object
      required: [username, groups]
      properties:
        username:
          type: string
        groups:
          type: array
          description: Camunda group IDs, read once at login (S5, S6)
          items:
            type: string
    BusinessDate:
      type: object
      required: [date, zone]
      properties:
        date:
          type: string
          format: date
          description: Today in the business zone, yyyy-MM-dd
          example: '2026-12-01'
        zone:
          type: string
          description: The business zone (app.business-zone)
          example: Asia/Riyadh
    StartWorkPackResponse:
      type: object
      description: The started process instance (x-assumption; BPA-6 does not state the response)
      required: [processInstanceKey]
      properties:
        processInstanceKey:
          $ref: '#/components/schemas/CamundaKey'
    TaskSummary:
      type: object
      required: [key, name, elementId, processInstanceKey, creationDate]
      properties:
        key:
          $ref: '#/components/schemas/CamundaKey'
        name:
          type: string
          description: Task name from the BPMN, for example "Sign off release"
          example: Sign off release
        elementId:
          type: string
          description: BPMN element ID of the user task
          enum: [UserTask_CreateWorkPack, UserTask_ConfirmWorkPack, UserTask_SignOffRelease, UserTask_ScheduleWorkPack, UserTask_BookHours, UserTask_ValidateHours, UserTask_ApproveHoursProduction, UserTask_ApproveHoursPpc, UserTask_SendHoursToFms, UserTask_UploadCompletionReport, UserTask_ApproveCompletion, UserTask_ApproveRetraction, UserTask_ReviewActualManhours, UserTask_ApproveWeeklyProgress]
        processInstanceKey:
          $ref: '#/components/schemas/CamundaKey'
        workpackNumber:
          allOf:
            - $ref: '#/components/schemas/WorkpackNumber'
          description: Process variable workpackNumber; absent on the Create Work Pack task, before the save step numbers it
        creationDate:
          type: string
          format: date-time
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [variables, validationMessages]
          properties:
            variables:
              type: object
              additionalProperties: true
              description: |
                The task's process variables that are on its read allow-list in backend configuration (09 S14). Names are
                camelCase forms of docs/data-model.md columns.
            validationMessages:
              type: array
              description: |
                Messages from the last rejected save (BPMN error from the save worker, G2), empty after a successful save
                (BPA-23 "Validation messages are cleared after a successful save"). Texts come from the stories, for
                example BPA-6 "Drawing is required", "Phase Finishing is not selected for this Work Pack", "Date to
                complete cannot be in the past"; BPA-23 "Material MAT-PIPE-06 is listed twice for phase Cutting";
                BPA-11 "Date cannot be earlier than 28 Oct 2026", "Planned end cannot be before planned start". Several
                carry values, so they are not an enum. The release-check and decline reasons are in `confirmMessage`.
              items:
                type: string
            confirmMessage:
              type: string
              description: |
                Process variable `confirmMessage` on the Confirm Workpack task: why the task came back. Set from the release
                check's releaseReason (BPA-8: "Materials are not reserved for this Workpack", "Drawing is not approved (IFC
                or As-Built required)") or by a declined sign-off (BPA-9: "Declined by Project Engineer: Wrong drawing
                revision"). Absent on other tasks and when the task has not come back (Process_PPC_WorkPackAssignment,
                BusinessRuleTask_ReleaseCheck output and ServiceTask_RecordSignOff).
    CompleteTaskRequest:
      type: object
      required: [variables]
      properties:
        variables:
          type: object
          additionalProperties: true
          description: |
            Variables to complete the task with. Each name must be on the task's write allow-list in backend configuration
            (09 S14; the configuration is authoritative). Names are camelCase forms of docs/data-model.md columns, for
            example: UserTask_CreateWorkPack and UserTask_ConfirmWorkPack take activityRef, drawingRef, departmentRef,
            completionDate, phases [{phase, manhours}] and materials [{materialRef, phase}] (Confirm also each material
            line's id, data model §6.3); UserTask_SignOffRelease takes signOffDecision (Approved or Declined) and
            declineReason; UserTask_ScheduleWorkPack takes plannedStartDate and plannedEndDate; UserTask_SendHoursToFms
            (BPA-58) takes fmsHandOffs [{fmsHoursExportId, outcome (Sent to FMS or Rejected by FMS), reason}], one entry for
            each file of the task (the reason is required, at most 250 characters, for Rejected by FMS). UserTask_ApproveCompletion (BPA-60) takes completionApprovals [{workpackNumber, approvedPct, remark}], one entry for each Work Pack of the week (the whole week is approved at once; approvedPct has at most 2 decimals and lies between 0 and 100; the remark is required, at most 250 characters, when approvedPct differs from the reported %; a 409 "Week ending <date> must be locked first" when the week before is not Locked; "Approvals are required", "Approvals must cover every Work Pack of the week", "Completion % must be between 0 and 100" and "Remark can be at most 250 characters" are ASSUMPTIONs); UserTask_ApproveCompletion also takes, per entry, retractionReason, required (at most 250 characters, ASSUMPTION text "Retraction reason can be at most 250 characters") when approvedPct is below the last locked % and no Approved retraction exists for that %, else 400 "A retraction reason is required when completion falls below last week (<prev>%)"; UserTask_ApproveRetraction (BPA-63, project-manager) takes retractionDecisions [{workpackNumber, retractionDecision (Approved or Declined), reason}], one entry for each Work Pack waiting for a retraction (Declined needs a reason of at most 250 characters, 400 "Reason is required"; 409 "You cannot approve a retraction you requested"; "Decisions must cover every Work Pack waiting for a retraction" and "Reason can be at most 250 characters" are ASSUMPTIONs); UserTask_ReviewActualManhours (BPA-64, cost-controller) takes cbsReviews [{cbsCodeRef, remark}], one entry for each CBS of the week (the remark is required for a CBS with a man-hour alert, 400 "A remark is required for <CBS> (alert raised)", at most 500 characters; "Reviews are required", "Remark can be at most 500 characters" and "CBS is not part of this review" are ASSUMPTIONs); BPA-67: a Validated or Approved decision of UserTask_ValidateHours, UserTask_ApproveHoursProduction or UserTask_ApproveHoursPpc on a submission with a line dated in a locked month answers 409 "Hours for <Month YYYY> are locked" (Returned and Rejected stay allowed, ASSUMPTION); UserTask_ApproveWeeklyProgress (BPA-66, project-manager) takes weekDecision (Approved or ChangesRequested), and for ChangesRequested weekChangeTarget (Progress or CostReview) and weekDecisionReason (required, 400 "Reason is required"; "Decision is required", "Target is required" and "Target <x> is not allowed" are ASSUMPTIONs); a target or reason sent with Approved is ignored (ASSUMPTION); 409 "You cannot approve a week whose progress you approved" when the user approved the % of any Work Pack of the week (Approved only); UserTask_UploadCompletionReport (BPA-59) takes completionReportId, the id of the upload that counts ("Completion report is required" and "Completion report is not for this week" are ASSUMPTIONs). The 400 texts "Outcome is required for each file", "Outcome must be Sent to FMS or Rejected by FMS", "Reason can be at most 250 characters" and "File is not part of this task" are ASSUMPTIONs ("Reason is required" is the story's).
            The backend adds `completedBy`, the session user's Camunda username, to every completion, so the save workers
            record who did the work (D63; BPA-6). It is on no allow-list: a request that sends it is refused with 400.
            Likewise it adds `completedTaskKey`, the key of the task being completed, the re-run key of a worker that records a
            decision (D65; BPA-9, release_signoff.task_key). It is on no allow-list either.
          example:
            signOffDecision: Approved
    Activity:
      type: object
      description: activity, joined to wbs and project_job_code (data model §3.1–3.3)
      required: [activityRef, activityName, wbsRef, projectRef, jobCodeRef]
      properties:
        activityRef:
          type: string
          example: A-2201
        activityName:
          type: string
        wbsRef:
          type: string
          example: '11031'
        projectRef:
          type: string
          description: wbs.project_ref
          example: PRJ-139
        jobCodeRef:
          type: string
          description: project_job_code.job_code_ref for the project
          example: JC-139
        facCrpo:
          type: string
          example: '139'
        facType:
          type: string
          example: Module
        facName:
          type: string
          example: M-01
        discipline:
          type: string
          example: Piping
        baselineStart:
          type: string
          format: date
          description: Absent when the activity has no plan data (BPA-6 A-2299)
        baselineEnd:
          type: string
          format: date
        budgetedUnits:
          type: number
          example: 1200
    Drawing:
      type: object
      description: drawing (data model §3.7)
      required: [drawingRef, title]
      properties:
        drawingRef:
          type: string
          example: DWG-118
        title:
          type: string
    Material:
      type: object
      description: material (data model §3.6)
      required: [materialRef, description]
      properties:
        materialRef:
          type: string
          example: MAT-PIPE-06
        description:
          type: string
    Department:
      type: object
      description: department (data model §3.5)
      required: [departmentRef, name]
      properties:
        departmentRef:
          type: string
          example: Fabrication
        name:
          type: string
    LookAhead:
      type: object
      description: lookahead_item for the Work Pack's drawing (data model §3.11)
      required: [workpackNumber, drawingRef]
      properties:
        workpackNumber:
          $ref: '#/components/schemas/WorkpackNumber'
        drawingRef:
          type: string
          description: The Work Pack's drawing (lookahead_item.design_dwg_ref)
