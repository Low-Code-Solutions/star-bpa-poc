    AssignmentFileResult:
      type: object
      description: assignment_file and its assignment_file_row rows (data model §5.1, §5.2)
      required: [id, fileName, receivedAt, rows]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          example: assign-01.xlsx
        receivedAt:
          type: string
          format: date-time
        outcome:
          type: string
          description: |
            File-level line; absent when the rows carry the outcomes (D70, D73). Texts (BPA-12): "File has no rows",
            "File cannot be read", "File layout not recognised", "File has too many rows" (more than 5000 rows; ASSUMPTION), "File already processed".
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentFileRow'
    AssignmentFileRow:
      type: object
      description: One assignment_file_row; worker_name is joined from the worker master, not stored (BPA-12)
      properties:
        rowNumber:
          type: integer
          description: Spreadsheet row; absent on the extra row for a removed Worker kept because hours are loaded (BPA-13)
        workpackNumber:
          type: string
          description: As written in the file (may be blank or unknown)
        badgeNo:
          type: string
          description: As written in the file
        workerName:
          type: string
          description: worker.name for the Badge No; absent when the Badge No is not in the worker master (BPA-12)
        outcome:
          type: string
          description: |
            Row outcome (D49). Texts from the stories, several with values, so not an enum. BPA-12: "Pending", "Work Pack is
            not Released", "Work Pack not ready for assignment yet", "Not processed: Work Pack not ready; resend the file",
            "Assignment still in progress; try again later", "Replacement already in progress", "Work Pack not found",
            "Already processed in an earlier upload". BPA-22: "Assigned", "Worker not in worker master data", "Worker
            listed twice for this Work Pack", "Workpack number is required", "Badge No is required", "Remarks can be at
            most 250 characters", "Estimated hours is required", "Estimated hours must be a number", "Estimated hours must
            be greater than 0", "Estimated hours can have at most 2 decimal places", "Estimated hours cannot exceed
            99,999.99". BPA-13: "Hours loaded; not removed", "Replacement could not be started; try again". Absent on a
            valid row of a Work Pack whose replacement was not applied (BPA-13).
        wpOutcome:
          type: string
          description: 'Only "Replacement not applied: file has rejected rows" (BPA-13, D71, B1)'
    ProgressWeek:
      type: object
      description: The Work Packs of a progress week, for the completion % approval (BPA-60)
      required: [weekEnding, basis, workpacks]
      properties:
        weekEnding:
          type: string
          format: date
        basis:
          type: string
          enum: [Physical, Hours]
          description: The setting progress.basis the approved % is pre-filled by (C-E2-2)
        workpacks:
          type: array
          items:
            $ref: '#/components/schemas/WorkpackProgressRow'
    CbsActualsWeek:
      type: object
      description: The CBS man-hour actuals of a progress week against the Current Forecast (BPA-64)
      required: [weekEnding, cbs, noCbsManhours]
      properties:
        weekEnding:
          type: string
          format: date
        cbs:
          type: array
          items:
            $ref: '#/components/schemas/CbsActualRow'
        noCbsManhours:
          type: number
          description: Approved man-hours of lines whose time sheet has no CBS (D40), shown as "No CBS"; never part of a check or an alert
    CbsActualRow:
      type: object
      description: One CBS of the week. Numbers have 2 decimals; a value that does not exist is absent.
      required: [cbsCodeRef, actualManhours, result, alert]
      properties:
        cbsCodeRef:
          type: string
          example: CBS-139-PIP-01
        actualManhours:
          type: number
          description: Cumulative Approved line hours up to the week ending
        currentForecastManhours:
          type: number
          description: cbs_forecast.current_forecast_mh (seeded copy, SOR D365 F&O Cost Control Report); absent when the CBS has none
        etc:
          type: number
          description: Estimate to complete = forecast minus actual; negative when over the forecast (the screen highlights it); absent without a forecast
        variancePct:
          type: number
          description: (actual - forecast) / forecast x 100, half-up to 2 decimals; absent without a forecast
        result:
          type: string
          enum: [NO_FORECAST, OVER_15_PCT, WITHIN]
          description: The result of Decision_ManhourVariance for the CBS
        alert:
          type: boolean
          description: True when a Manhour alert was raised for the CBS in this period
        remark:
          type: string
          description: The Cost Controller's remark for the CBS and week, if the review was recorded
        actualCost:
          type: number
          description: Cumulative actual cost in SAR up to the check month (cbs_actual_cost, seeded copy, SOR D365 F&O Finance); absent when the CBS has none (BPA-65)
        revisedBudgetCost:
          type: number
          description: cbs_forecast.revised_budget_cost in SAR (seeded copy, SOR D365 F&O Cost Control Report); absent when the CBS has none (BPA-65)
        costVariancePct:
          type: number
          description: (actual cost - revised budget) / revised budget x 100, half-up to 2 decimals; absent without a revised budget (BPA-65)
        costResult:
          type: string
          enum: [NO_BUDGET, OVER_10_PCT, WITHIN]
          description: The result of Decision_CostVariance for the CBS (BPA-65)
        costAlert:
          type: boolean
          description: True when a Cost alert was raised for the CBS and linked to this period (BPA-65)
    VarianceAlert:
      type: object
      description: An in-system variance alert of the session user (variance_alert, channel InSystem; data model §13.5)
      required: [cbsCodeRef, alertType, message, alertDate, sentAt]
      properties:
        weekEnding:
          type: string
          format: date
          description: The progress week the alert belongs to; absent for a daily close cost alert that no weekly check linked (BPA-65)
        alertDate:
          type: string
          format: date
          description: The business date (Asia/Riyadh) the alert was sent for; a Cost alert is once per CBS, recipient, channel and day (BPA-65)
        cbsCodeRef:
          type: string
          example: CBS-139-PIP-01
        alertType:
          type: string
          enum: [Manhour, Cost]
        message:
          type: string
          example: Man-hours on CBS-139-PIP-01 are 20.00% over the Current Forecast (1200.00 of 1000.00 MH), week ending 19 Nov 2026
        sentAt:
          type: string
          format: date-time
    EarnedManhoursWeek:
      type: object
      description: The activities of a progress week with their progress % and Earned man-hours (BPA-62)
      required: [weekEnding, activities]
      properties:
        weekEnding:
          type: string
          format: date
        activities:
          type: array
          items:
            $ref: '#/components/schemas/EarnedManhoursRow'
    EarnedManhoursRow:
      type: object
      description: One activity of the week. Numbers have 2 decimals; a value that does not exist is absent.
      required: [activityRef, activityName, actualPct]
      properties:
        activityRef:
          type: string
          example: A-2201
        activityName:
          type: string
        actualPct:
          type: number
          description: activity_progress.actual_pct, the hours-weighted roll-up (E2-D10), half-up to 2 decimals
        budgetedUnits:
          type: number
          description: The activity's budgeted units snapshotted on the week's row; absent when the activity has none (P6 via D365 PMS)
        earnedManhours:
          type: number
          description: Cumulative Earned man-hours = actual % / 100 x budgeted units, half-up to 2 decimals; absent without budgeted units
        lastLockedEarnedManhours:
          type: number
          description: The Earned man-hours of the latest Locked week before this one; absent when the activity has no Locked row
        weekIncrease:
          type: number
          description: This week's Earned man-hours minus the latest Locked week's (0 when none), derived and never stored; absent without Earned man-hours
    WorkpackProgressRow:
      type: object
      description: One Work Pack of the week. Percentages and hours are numbers with 2 decimals; a value that does not exist is absent.
      required: [workpackNumber, noReportRow, lastLockedPct, approvedHours, approvedPct]
      properties:
        workpackNumber:
          type: string
          example: WP-000457
        noReportRow:
          type: boolean
          description: True when the week's report has no row for the Work Pack (D6); approvedPct then starts from lastLockedPct
        reportedPct:
          type: number
          description: workpack_progress.reported_pct, from the FMS or PMS report (SOR FMS); absent without a report row
        lastLockedPct:
          type: number
          description: The approved % of the latest Locked week before this one; 0 when the Work Pack was never locked (decision (c))
        hoursBasedPct:
          type: number
          description: Approved hours up to the week ending divided by the Work Pack's budget (sum of phase man-hours), derived, information only; absent when the budget is 0
        reportedByProductionPct:
          type: number
          description: The latest % reported by production with the daily hours (FRD-7 §7.5.6 #6), information only (C-E2-10); absent when none
        fmsActualHours:
          type: number
          description: Actual hours of the week's accepted report row, information only (BPA-59 (a)); absent when the row has none
        approvedHours:
          type: number
          description: The POC's Approved hours of the Work Pack up to the week ending
        hoursDifference:
          type: number
          description: fmsActualHours minus approvedHours; absent when fmsActualHours is
        approvedPct:
          type: number
          description: The % to pre-fill (by basis, or the stored approval when the task came back)
        remark:
          type: string
          description: The stored remark of an earlier approval of this week, if any
        retractionReason:
          type: string
          description: BPA-63. PPC's reason of the open (undecided) retraction request for this Work Pack, if any
        retractionRequestedBy:
          type: string
          description: BPA-63. Who requested the open retraction (Camunda identity), if any
        retractionDeclinedReason:
          type: string
          description: BPA-63. The Project Manager's reason when the latest request for the Work Pack's current approvedPct was declined ("Retraction declined, reason"); absent once PPC changes the %
        retractionApproved:
          type: boolean
          description: BPA-63. True when an Approved retraction of this Work Pack is for exactly the stored approvedPct, so a % kept at it needs no new reason (the screen's check; the server decides)
        unsentLines:
          type: array
          description: >-
            BPA-66 (E2-19; BPA-67 rule (c)). Only for a Work Pack whose approvedPct is exactly 100: its time sheet lines still Draft or Returned (not yet sent for
            approval), so the Project Manager sees them before approving the week. Information only; no date bound (ASSUMPTION, plan Q5). Empty or absent otherwise.
          items:
            $ref: '#/components/schemas/UnsentLine'
    UnsentLine:
      type: object
      description: BPA-66. One Draft or Returned time sheet line of a Work Pack approved at 100%.
      required: [employeeRef, workDate, phase, hours, status]
      properties:
        employeeRef:
          type: string
          example: E1021
        workDate:
          type: string
          format: date
        phase:
          type: string
          example: Cutting
        hours:
          type: number
          description: Hours with 2 decimals
          example: 8.00
        status:
          type: string
          enum: [Draft, Returned]
