# nginx for the portal in the compose stack (BPA-80; ADR 0004, ADR 0005 S26). Serves the built portal and proxies /api to bpa-app,
# so the browser sees one origin (http://localhost:3000) and the session and XSRF-TOKEN cookies work as under the Vite proxy (BPA-43 Q11).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default is 1 MB; the assignment upload allows 5 MB files (spring.servlet.multipart: 5 MB file, 6 MB request, BPA-12).
    # Set above that so the app, not nginx, answers an oversized upload.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, and the upstream name in a variable: nginx then looks bpa-app up again every few seconds. With a fixed
    # `proxy_pass http://bpa-app:8080` it would keep the first container address, and after `docker compose up -d --build bpa-app`
    # every call would answer 502 until nginx was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API. Before the SPA fallback, so a /api path never turns into index.html. With a variable in proxy_pass and no URI part,
    # the request URI is passed on unchanged. Cookie, Set-Cookie and X-XSRF-TOKEN pass untouched: no proxy_cookie_* and no header is
    # stripped or rewritten here.
    location /api {
        set $backend http://bpa-app:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have hashed names: cache them for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router: any other path is the portal (deep links and reloads). index.html itself is never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
